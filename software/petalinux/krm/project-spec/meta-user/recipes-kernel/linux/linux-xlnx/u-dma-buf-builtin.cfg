# Build u-dma-buf into the kernel Image so /dev/udmabufN devices come up
# from the device tree with no module in the rootfs (we boot a custom
# rootfs that only receives BOOT.BIN/boot.scr/image.ub).
# U_DMA_BUF_CONFIG stays off: that selects the upstream defaults
# (quirk-mmap for cacheable mmap on arm64, ioctl interface, dma-buf export).
CONFIG_U_DMA_BUF=y
